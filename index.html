<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3A VENDE - Tres Arroyos</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0F0F0F;--card:#1A1A1A;--card2:#222;--line:#262626;--ink:#FFF;--muted:#888;--muted2:#555}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
.top{height:60px;padding:0 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(15,15,15,.95);backdrop-filter:blur(10px);z-index:20}
.logo{font-size:18px;font-weight:700;letter-spacing:-.02em}.logo span{font-weight:500;color:var(--muted);font-size:13px;margin-left:8px}
.view{display:none}.view.active{display:block}

/* INICIO */
#inicio{max-width:420px;margin:0 auto;padding:48px 20px}
.h1{font-size:30px;font-weight:700;line-height:1.05;letter-spacing:-.03em}
.h1 span{color:var(--muted);font-weight:500}
.sub{color:var(--muted);font-size:14px;line-height:1.5;margin-top:12px}
.btn-big{width:100%;padding:20px 18px;border-radius:18px;border:none;font-size:17px;font-weight:700;cursor:pointer;margin-top:14px;display:flex;justify-content:space-between;align-items:center;transition:.2s}
.btn-big:active{transform:scale(.98)}
.btn-cliente{background:#fff;color:#111}.btn-vendedor{background:var(--card);color:#fff;border:1px solid var(--line)}
.stats{margin-top:28px;display:flex;gap:16px;padding:16px;border:1px solid var(--line);border-radius:16px;background:var(--card)}
.stat b{font-size:18px;display:block}.stat span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}

/* CATALOGO PRO SIMPLE */
#catalogo{max-width:1200px;margin:0 auto}
.bar{position:sticky;top:60px;z-index:15;background:var(--bg);border-bottom:1px solid var(--line);padding:14px 20px}
.search{position:relative;max-width:520px}
.search input{width:100%;padding:15px 20px 15px 44px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:#fff;font-size:15px;outline:none}
.search input:focus{border-color:#3A3A3A;background:var(--card2)}
.search i{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--muted2)}
.top-actions{display:flex;gap:8px;margin-top:12px}
.btn-small{padding:10px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--muted);font-size:13px;font-weight:600;cursor:pointer}
.btn-small.active{background:#fff;color:#111;border-color:#fff}

.filtros{padding:12px 20px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line);position:sticky;top:128px;background:var(--bg);z-index:14}
.f-btn{padding:10px 16px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--muted);font-size:13px;font-weight:600;white-space:nowrap;cursor:pointer;transition:.2s}
.f-btn.active{background:#fff;color:#111;border-color:#fff}

.info-bar{padding:14px 20px;font-size:12px;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.grid{padding:0 20px 20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.prod{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;cursor:pointer;transition:.2s;display:flex;flex-direction:column}
.prod:hover{border-color:#333;transform:translateY(-2px)}
.prod img{width:100%;height:240px;object-fit:cover;background:#111}
.prod-body{padding:14px;display:flex;flex-direction:column;gap:5px;flex:1}
.local{font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.local:hover{color:var(--ink);text-decoration:underline}
.precio{font-size:18px;font-weight:700}.nombre{font-size:14px;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:36px}
.desc{font-size:12px;color:var(--muted);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:34px}

.load-more{padding:30px 20px;text-align:center}
.btn-load{padding:14px 24px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:14px;font-weight:600;cursor:pointer}
.btn-load:hover{background:var(--card2)}

.empty{grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--muted)}
.empty b{color:var(--ink);display:block;font-size:16px;margin-bottom:6px}

@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr);gap:10px;padding:0 12px 12px}.prod img{height:160px}.precio{font-size:16px}.nombre{font-size:13px}.bar{padding:12px}.filtros{top:122px}}
</style>
</head>
<body>

<div class="top">
<div class="logo">3A VENDE <span>Tres Arroyos</span></div>
<div style="font-size:11px;color:var(--muted)" id="totalLocales">0 locales</div>
</div>

<div id="inicio" class="view active">
<div class="h1">Todo<br>Tres Arroyos<br><span>en un lugar.</span></div>
<p class="sub">Elegí qué querés hacer. Simple, sin registro.</p>

<button class="btn-big btn-cliente" onclick="go('catalogo')">
<span>🛒 SOY CLIENTE<br><small style="font-size:12px;font-weight:500;opacity:.6">Quiero comprar</small></span>
<span>→</span>
</button>

<button class="btn-big btn-vendedor" onclick="location.href='panel.html'">
<span>🏪 SOY VENDEDOR<br><small style="font-size:12px;font-weight:500;opacity:.6">Tengo un local</small></span>
<span>→</span>
</button>

<div class="stats">
<div class="stat"><b id="statLocales">0</b><span>Locales</span></div>
<div class="stat"><b id="statProd">0</b><span>Productos</span></div>
<div class="stat"><b>Sin login</b><span>Para comprar</span></div>
</div>
</div>

<div id="catalogo" class="view">
<div class="bar">
<div class="search"><i>⌕</i><input id="search" placeholder="Buscar producto o local..."></div>
<div class="top-actions">
<button class="btn-small active" onclick="go('inicio')">← Inicio</button>
<button class="btn-small" onclick="location.href='panel.html'">Soy vendedor</button>
<button class="btn-small" id="btnClear" style="margin-left:auto;display:none" onclick="clearSearch()">✕ Limpiar</button>
</div>
</div>

<div class="filtros" id="filtros">
<div class="f-btn active" data-cat="all">Todos</div>
<div class="f-btn" data-cat="clothing">Ropa</div>
<div class="f-btn" data-cat="food">Comida</div>
<div class="f-btn" data-cat="home">Hogar</div>
<div class="f-btn" data-cat="panaderia">Panadería</div>
<div class="f-btn" data-cat="verduleria">Verdulería</div>
<div class="f-btn" data-cat="artesanias">Artesanías</div>
</div>

<div class="info-bar">
<span id="infoText">0 productos</span>
<span id="infoLocales" style="color:var(--muted2)"></span>
</div>

<div class="grid" id="grid"></div>

<div class="load-more" id="loadMoreWrap" style="display:none">
<button class="btn-load" onclick="loadMore()">Cargar más productos</button>
</div>
</div>

<script>
let activeCat='all', query='', visibleCount=20, filtered=[];

const go=id=>{
document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
document.getElementById(id).classList.add('active');
window.scrollTo(0,0);
if(id==='catalogo') render();
}

const getImg=p=>p.img||p.imgs?.[0]||'https://via.placeholder.com/400/1A1A1A/666?text=3A';

function getAllProducts(){
return JSON.parse(localStorage.getItem('marketProductsAR')||'[]');
}
function getAllStores(){
return JSON.parse(localStorage.getItem('marketStores')||'{}');
}

function updateStats(){
let prods=getAllProducts();
let stores=getAllStores();
document.getElementById('totalLocales').textContent=Object.keys(stores).length+' locales';
document.getElementById('statLocales').textContent=Object.keys(stores).length;
document.getElementById('statProd').textContent=prods.length;
}

function applyFilters(){
let all=getAllProducts();
let q=query.toLowerCase();
filtered=all.filter(p=>{
let matchCat=activeCat==='all'||p.category===activeCat;
let matchQuery=!q||p.name.toLowerCase().includes(q)||p.store.toLowerCase().includes(q)||(p.desc||'').toLowerCase().includes(q);
return matchCat&&matchQuery;
});
visibleCount=20;
}

function render(){
applyFilters();
let toShow=filtered.slice(0,visibleCount);
let localesUnicos=new Set(filtered.map(p=>p.storeId)).size;

document.getElementById('infoText').textContent=filtered.length+' productos';
document.getElementById('infoLocales').textContent=localesUnicos+' locales';
document.getElementById('btnClear').style.display=query?'block':'none';

let grid=document.getElementById('grid');
if(filtered.length===0){
grid.innerHTML=`<div class="empty"><b>Sin resultados</b>Probá buscando otra cosa o cambiá de categoría</div>`;
document.getElementById('loadMoreWrap').style.display='none';
return;
}

grid.innerHTML=toShow.map(p=>`
<div class="prod" onclick="location.href='store.html?store=${p.storeId}'">
<img src="${getImg(p)}" loading="lazy">
<div class="prod-body">
<div class="local" onclick="event.stopPropagation();location.href='store.html?store=${p.storeId}'">${p.store} → VER LOCAL</div>
<div class="precio">$${p.price.toLocaleString('es-AR')}</div>
<div class="nombre">${p.name}</div>
<div class="desc">${p.desc||''}</div>
</div>
</div>
`).join('');

document.getElementById('loadMoreWrap').style.display=filtered.length>visibleCount?'block':'none';
updateStats();
}

function loadMore(){
visibleCount+=20;
render();
window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});
}

function clearSearch(){
document.getElementById('search').value='';
query='';
render();
}

document.getElementById('search').addEventListener('input',e=>{
query=e.target.value;
render();
});

document.getElementById('filtros').addEventListener('click',e=>{
if(e.target.classList.contains('f-btn')){
document.querySelectorAll('.f-btn').forEach(b=>b.classList.remove('active'));
e.target.classList.add('active');
activeCat=e.target.dataset.cat;
render();
}
});

// Demo data si está vacío
if(!localStorage.getItem('marketProductsAR')){
let demo=[];
for(let i=1;i<=30;i++){
demo.push({
id:i,
store: i%2===0?'Zapatería Centro':'Panadería La Espiga',
storeId: i%2===0?'zapateria-centro':'panaderia-la-espiga',
city:'Tres Arroyos',
dir: i%2===0?'Av. Moreno 456':'Rivadavia 456',
name: i%2===0?`Zapatillas Modelo ${i} - Talle 38 al 44`:`Medialunas x12 - Lote ${i}`,
price: i%2===0?50000+i*100:3000+i*50,
stock:10,
category: i%2===0?'clothing':'panaderia',
img: i%2===0?'https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400&h=400&fit=crop':'https://images.unsplash.com/photo-1558961363-fa8fdf82db8e?w=400&h=400&fit=crop',
desc: i%2===0?'Cuero original. Envío gratis Tres Arroyos.':'Recién horneadas hoy.'
});
}
localStorage.setItem('marketProductsAR',JSON.stringify(demo));
localStorage.setItem('marketStores',JSON.stringify({
'zapateria-centro':{name:'Zapatería Centro',desc:'Calzado de Tres Arroyos',dir:'Av. Moreno 456',city:'Tres Arroyos',hor:'Lun a Sáb 9 a 20hs',wsp:'2983 123456',ig:'@zapat.centro',profile:'https://via.placeholder.com/200',cover:'https://images.unsplash.com/photo-1441986300917-64674bd600d8?w=1000&h=400&fit=crop'},
'panaderia-la-espiga':{name:'Panadería La Espiga',desc:'Panadería artesanal',dir:'Rivadavia 456',city:'Tres Arroyos',hor:'Lun a Sáb 6 a 20hs',wsp:'2983 654321',ig:'@laespiga',profile:'https://via.placeholder.com/200',cover:'https://images.unsplash.com/photo-1509440159596-0249088772ff?w=1000&h=400&fit=crop'}
}));
}

updateStats();
render();
</script>
</body>
  </html>
