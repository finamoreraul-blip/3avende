<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi Local - 3A VENDE</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0F0F0F;--card:#1A1A1A;--card2:#222;--line:#262626;--ink:#FFF;--muted:#888;--muted2:#555}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:var(--bg);color:var(--ink)}
.top{height:60px;padding:0 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(15,15,15,.95);backdrop-filter:blur(10px);z-index:20}
.logo{font-weight:700;font-size:16px}
.btn{padding:10px 16px;border-radius:999px;border:none;font-weight:700;font-size:13px;cursor:pointer}
.btn-white{background:#fff;color:#111}.btn-dark{background:var(--card);border:1px solid var(--line);color:#fff}
.wrap{max-width:1100px;margin:0 auto;padding:20px;display:grid;grid-template-columns:360px 1fr;gap:20px}
.box{border:1px solid var(--line);border-radius:20px;background:var(--card);padding:20px}
.box h3{font-size:16px;font-weight:700}.box p{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.4}
label{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:18px;display:block}
input,textarea,select{width:100%;padding:14px 14px;border-radius:12px;border:1px solid var(--line);background:#111;color:#fff;font-size:14px;margin-top:6px;outline:none}
input:focus,textarea:focus{border-color:#3A3A3A}
.file{margin-top:8px;font-size:12px;color:var(--muted)}
.preview{margin-top:16px;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#111}
.preview-cover{width:100%;height:120px;object-fit:cover;background:#222}
.preview-body{padding:12px;display:flex;gap:10px;align-items:center}
.preview-profile{width:48px;height:48px;border-radius:50%;object-fit:cover;background:#222;border:2px solid var(--bg);margin-top:-28px}
.btn-save{width:100%;padding:16px;border-radius:999px;border:none;background:#fff;color:#111;font-weight:700;font-size:15px;margin-top:20px;cursor:pointer}
.btn-save:active{transform:scale(.98)}
.prod-list{margin-top:20px;display:grid;gap:10px}
.prod-item{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:14px;background:#111}
.prod-item img{width:52px;height:52px;border-radius:10px;object-fit:cover;background:#222}
.prod-item b{font-size:13px;display:block}.prod-item span{font-size:11px;color:var(--muted)}
.btn-del{background:transparent;border:1px solid #333;color:var(--muted);padding:6px 12px;border-radius:999px;font-size:11px;cursor:pointer}
@media(max-width:900px){.wrap{grid-template-columns:1fr}.top{padding:0 16px}.wrap{padding:16px}}
</style>
</head>
<body>

<div class="top">
<div class="logo">PANEL • 3A VENDE</div>
<div style="display:flex;gap:8px">
<button class="btn btn-dark" onclick="location.href='index.html'">Ver catálogo</button>
<button class="btn btn-white" onclick="goStore()">Ver mi tienda</button>
</div>
</div>

<div class="wrap">

<!-- IZQ: MI LOCAL -->
<div class="box">
<h3>Mi local</h3>
<p>Foto de perfil, portada, dirección y datos. Esto arma tu tienda.</p>

<label>ID de tu tienda *</label>
<input id="sId" placeholder="ej: zapateria-centro" value="mi-local">
<div style="font-size:11px;color:var(--muted2);margin-top:4px">Sin espacios. Ej: panaderia-la-espiga</div>

<label>Nombre del local *</label>
<input id="sName" placeholder="Zapatería Centro">

<label>Descripción corta</label>
<textarea id="sDesc" rows="2" placeholder="Qué venden, desde cuándo..."></textarea>

<label>Foto de perfil</label>
<input id="sProfile" placeholder="https://...jpg">
<input type="file" id="fProfile" accept="image/*" class="file">

<label>Foto de portada</label>
<input id="sCover" placeholder="https://...jpg">
<input type="file" id="fCover" accept="image/*" class="file">

<label>Dirección *</label>
<input id="sDir" placeholder="Av. Moreno 456">

<label>Ciudad</label>
<input id="sCity" value="Tres Arroyos">

<label>Horario</label>
<input id="sHor" placeholder="Lun a Sáb 9 a 20hs">

<label>WhatsApp</label>
<input id="sWsp" placeholder="2983 123456">

<label>Instagram</label>
<input id="sIg" placeholder="@mi.local">

<button class="btn-save" onclick="saveStore()">Guardar mi local</button>

<div class="preview" id="storePreview">
<img class="preview-cover" id="pCover" src="https://images.unsplash.com/photo-1441986300917-64674bd600d8?w=600&h=200&fit=crop">
<div class="preview-body">
<img class="preview-profile" id="pProfile" src="https://via.placeholder.com/100/222/666?text=3A">
<div><div id="pName" style="font-size:13px;font-weight:700">Mi local</div><div id="pCity" style="font-size:11px;color:var(--muted)">Tres Arroyos</div></div>
</div>
</div>
</div>

<!-- DER: PRODUCTOS -->
<div class="box">
<h3>Mis productos</h3>
<p>Foto grande arriba, precio y descripción abajo.</p>

<label>Foto del producto *</label>
<input id="pImg" placeholder="https://...jpg">
<input type="file" id="fProd" accept="image/*" class="file">

<label>Nombre del producto *</label>
<input id="pNameProd" placeholder="Zapatillas Blancas Talle 38 al 44">

<label>Precio *</label>
<input id="pPrice" type="number" placeholder="54900">

<label>Stock</label>
<input id="pStock" type="number" value="1">

<label>Categoría</label>
<select id="pCat">
<option value="clothing">Ropa</option>
<option value="food">Comida</option>
<option value="home">Hogar</option>
<option value="panaderia">Panadería</option>
<option value="verduleria">Verdulería</option>
<option value="artesanias">Artesanías</option>
</select>

<label>Descripción</label>
<textarea id="pDesc" rows="3" placeholder="Material, talle, envío..."></textarea>

<button class="btn-save" onclick="addProd()">Publicar producto</button>

<div style="margin-top:24px;display:flex;justify-content:space-between;align-items:center">
<b style="font-size:13px">Publicados</b>
<span id="prodCount" style="font-size:11px;color:var(--muted)">0 productos</span>
</div>

<div class="prod-list" id="prodList"></div>
</div>

</div>

<script>
function goStore(){
let id=document.getElementById('sId').value.trim().toLowerCase().replace(/\s+/g,'-');
if(!id) return alert('Poné ID de tu tienda');
location.href='store.html?store='+id;
}
function fileToInput(file,inputId){
let r=new FileReader();
r.onload=()=>{document.getElementById(inputId).value=r.result;updatePreview();};
r.readAsDataURL(file);
}
function updatePreview(){
let name=document.getElementById('sName').value||'Mi local';
let city=document.getElementById('sCity').value||'Tres Arroyos';
let profile=document.getElementById('sProfile').value;
let cover=document.getElementById('sCover').value;
document.getElementById('pName').textContent=name;
document.getElementById('pCity').textContent=city;
if(profile) document.getElementById('pProfile').src=profile;
if(cover) document.getElementById('pCover').src=cover;
}
['sName','sCity','sProfile','sCover'].forEach(id=>{document.getElementById(id).addEventListener('input',updatePreview)});

document.getElementById('fProfile').addEventListener('change',e=>fileToInput(e.target.files[0],'sProfile'));
document.getElementById('fCover').addEventListener('change',e=>fileToInput(e.target.files[0],'sCover'));
document.getElementById('fProd').addEventListener('change',e=>fileToInput(e.target.files[0],'pImg'));

function saveStore(){
let id=document.getElementById('sId').value.trim().toLowerCase().replace(/\s+/g,'-');
if(!id) return alert('Falta ID');
let stores=JSON.parse(localStorage.getItem('marketStores')||'{}');
stores[id]={
name:document.getElementById('sName').value||id,
desc:document.getElementById('sDesc').value,
profile:document.getElementById('sProfile').value,
cover:document.getElementById('sCover').value,
dir:document.getElementById('sDir').value,
city:document.getElementById('sCity').value,
hor:document.getElementById('sHor').value,
wsp:document.getElementById('sWsp').value,
ig:document.getElementById('sIg').value
};
localStorage.setItem('marketStores',JSON.stringify(stores));
alert('Local guardado!\nTu link: store.html?store='+id);
loadList();
updatePreview();
}

function addProd(){
let idStore=document.getElementById('sId').value.trim().toLowerCase().replace(/\s+/g,'-');
if(!idStore) return alert('Guardá tu local primero');
let all=JSON.parse(localStorage.getItem('marketProductsAR')||'[]');
let prod={
id:Date.now(),
store:document.getElementById('sName').value||idStore,
storeId:idStore,
city:document.getElementById('sCity').value||'Tres Arroyos',
dir:document.getElementById('sDir').value,
name:document.getElementById('pNameProd').value,
price:parseFloat(document.getElementById('pPrice').value)||0,
stock:parseInt(document.getElementById('pStock').value)||1,
category:document.getElementById('pCat').value,
desc:document.getElementById('pDesc').value,
img:document.getElementById('pImg').value
};
if(!prod.name||!prod.price) return alert('Falta nombre y precio');
all.unshift(prod);
localStorage.setItem('marketProductsAR',JSON.stringify(all));
document.getElementById('pNameProd').value='';
document.getElementById('pPrice').value='';
document.getElementById('pDesc').value='';
document.getElementById('pImg').value='';
loadList();
}

function loadList(){
let id=document.getElementById('sId').value.trim().toLowerCase().replace(/\s+/g,'-');
let all=JSON.parse(localStorage.getItem('marketProductsAR')||'[]');
let mine=all.filter(p=>p.storeId===id);
document.getElementById('prodCount').textContent=mine.length+' productos';
document.getElementById('prodList').innerHTML=mine.map(p=>`
<div class="prod-item">
<img src="${p.img}">
<div style="flex:1"><b>${p.name}</b><span>$${p.price.toLocaleString('es-AR')} • Stock ${p.stock}</span></div>
<button class="btn-del" onclick="delProd(${p.id})">Borrar</button>
</div>
`).join('')||'<div style="text-align:center;padding:30px;color:var(--muted);font-size:13px">Sin productos aún</div>';
}

function delProd(id){
let all=JSON.parse(localStorage.getItem('marketProductsAR')||'[]');
localStorage.setItem('marketProductsAR',JSON.stringify(all.filter(p=>p.id!==id)));
loadList();
}

document.getElementById('sId').addEventListener('input',loadList);

// Cargar si ya existe
let stores=JSON.parse(localStorage.getItem('marketStores')||'{}');
let keys=Object.keys(stores);
if(keys.length>0){
let k=keys[0];
document.getElementById('sId').value=k;
let s=stores[k];
document.getElementById('sName').value=s.name||'';
document.getElementById('sDesc').value=s.desc||'';
document.getElementById('sProfile').value=s.profile||'';
document.getElementById('sCover').value=s.cover||'';
document.getElementById('sDir').value=s.dir||'';
document.getElementById('sCity').value=s.city||'Tres Arroyos';
document.getElementById('sHor').value=s.hor||'';
document.getElementById('sWsp').value=s.wsp||'';
document.getElementById('sIg').value=s.ig||'';
updatePreview();
}
loadList();
</script>
</body>
</html>
